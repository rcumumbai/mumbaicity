<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumbai-City ALC Awards 2026 - Eligibility Check</title>
<style>
  :root{
    --ink:#1B2430; --ink-soft:#6B7686; --line:#CBD3DB; --paper:#F6F8FA;
    --mscit:#1B4E7A; --mscit-tint:#EAF1F8;
    --klic:#7A3E8C; --klic-tint:#F4EEF7;
    --good:#1E8E5A; --bad:#C4432E; --gold:#B5811E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--paper); color:var(--ink); font-size:13px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:12px 18px 16px;}

  .headbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .headbar h1{font-size:16px;margin:0;font-weight:800;color:var(--mscit);}
  .headbar .tagline{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .headbar .gen-time{font-size:10.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:100px;padding:4px 11px;}

  .search-bar{
    display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:8px 14px;margin-bottom:10px;flex-wrap:wrap;
  }
  .search-bar label{font-weight:700;font-size:12.5px;color:var(--ink-soft);}
  .search-bar input[type=text]{
    padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;width:170px;
    font-family:'SFMono-Regular',Consolas,monospace;letter-spacing:.4px;
  }
  .search-bar input[type=text]:focus{outline:none;border-color:var(--mscit);}
  .search-bar button{
    border:none;background:var(--mscit);color:#fff;padding:7px 20px;border-radius:7px;
    font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .search-bar button:hover{opacity:.9;}
  .search-bar .msg{font-size:12px;color:var(--bad);font-weight:600;}

  .center-line{
    display:none;background:#fff;border:1px solid var(--line);border-left:4px solid var(--mscit);
    border-radius:8px;padding:6px 14px;margin-bottom:10px;font-size:12.5px;
  }
  .center-line b{color:var(--ink);}
  .center-line span{color:var(--ink-soft);margin-right:14px;}

  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;}
  .panel h2{margin:0 0 7px;font-size:13px;font-weight:800;color:var(--ink);}
  .panel .as-of{font-size:10.5px;color:var(--ink-soft);font-weight:400;margin-left:8px;}

  table{border-collapse:collapse;width:100%;font-size:12px;}
  table th, table td{border:1px solid var(--line);padding:3.5px 8px;text-align:center;}
  table td.rowlabel, table th.rowlabel{text-align:left;font-weight:700;}
  table thead th{background:#F0F3F6;font-weight:800;color:var(--ink);}
  table tbody tr:nth-child(even) td{background:#FAFBFC;}
  table tr.total-row td{font-weight:800;background:#EEF2F5 !important;}
  table tr.pct-row td{font-style:italic;color:var(--ink-soft);background:#fff !important;}
  table td.num{font-family:'SFMono-Regular',Consolas,monospace;}
  table td.fp{color:var(--gold);font-weight:700;}
  table td.conv-cell{color:var(--klic);font-weight:700;}
  table td.live{position:relative;}
  table td.live::after{
    content:"live"; position:absolute; top:1px; right:2px; font-size:7.5px; font-weight:800;
    color:var(--good); letter-spacing:.3px;
  }

  .row-mscit td.rowlabel{color:var(--mscit);}
  .row-klic td.rowlabel{color:var(--klic);}

  .two-col{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start;}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;}}

  .badge-title{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .badge-title .chip{
    font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff;
    padding:3px 9px;border-radius:100px;
  }
  .chip.mscit{background:var(--mscit);}
  .chip.klic{background:var(--klic);}

  .empty-state{text-align:center;padding:50px 10px;color:var(--ink-soft);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  .delta{font-weight:700;}
  .delta.up{color:var(--good);}
  .delta.down{color:var(--bad);}

  footer.note{text-align:center;font-size:10px;color:var(--ink-soft);margin-top:6px;}

  /* ---- Award banner ---- */
  .award-banner{
    display:flex; align-items:flex-start; gap:12px; border-radius:12px; padding:11px 18px;
    margin-bottom:10px; box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .award-banner .award-icon{font-size:26px; line-height:1; flex-shrink:0;}
  .award-banner .award-text{flex:1;}
  .award-banner .award-current{font-size:11px; opacity:.85; margin-bottom:2px; font-weight:600;}
  .award-banner .award-headline{font-size:14px; font-weight:800; line-height:1.3;}
  .award-banner .award-sub{font-size:12px; margin-top:3px; opacity:.9;}
  .award-need-line{
    display:inline-block; margin-top:3px; font-size:13px; font-weight:800;
    color:#B23A2E; animation: awardPulse 1.6s ease-in-out infinite;
  }
  @keyframes awardPulse{
    0%, 100% { opacity:1; }
    50% { opacity:.5; }
  }
  .award-banner.achieved{background:linear-gradient(120deg,#FFF6DD,#FFEBB8); border:1.5px solid #E8B93A; color:#7A5A00;}
  .award-banner.topped{background:linear-gradient(120deg,#FFF0D6,#FFD98A); border:1.5px solid #D9A227; color:#6B4A00;}
  .award-banner.pending{background:linear-gradient(120deg,#FFF0EC,#FFD9CC); border:1.5px solid #E2764F; color:#8A3A1B;}
  .award-banner.encourage{background:linear-gradient(120deg,#EAF2FF,#D7E7FF); border:1.5px solid #6E9EDB; color:#1B4E7A;}
  .award-disclaimer{font-size:10px; color:var(--ink-soft); font-style:italic; margin:-4px 0 8px 4px;}
</style>
</head>

  var msArr25 = c.msCit2025.slice(0, MSCIT_CUTOFF+1);
  var msArr26 = c.msCit2026.slice(0, MSCIT_CUTOFF+1);
  var msLastLabel = MSCIT_2026_KEYS[MSCIT_CUTOFF];
  var msLastLive = false;
  if(instMap[msLastLabel] && instMap[msLastLabel][c.code] && instMap[msLastLabel][c.code].totalConfirmed !== null && instMap[msLastLabel][c.code].totalConfirmed !== undefined){
    msArr26[MSCIT_CUTOFF] = instMap[msLastLabel][c.code].totalConfirmed;
    msLastLive = true;
  }

  var msCitFullyPaid = [];
  for(var i=0;i<=MSCIT_CUTOFF;i++){
    var label = MSCIT_2026_KEYS[i];
    var dict = instMap[label];
    var rec = dict ? dict[c.code] : null;
    msCitFullyPaid.push(rec ? rec.fullyPaid : null);
  }
  var anyInstall = msCitFullyPaid.some(function(v){ return v!==null; });

  /* ---- KLiC: truncate to last active batch, override that batch's count from Total Confirmed ---- */
  var klLabels = KLIC_PAIR_SUB.slice(0, KLIC_CUTOFF+1);
  var klArr25 = c.klic2025.slice(0, KLIC_CUTOFF+1);
  var klArr26 = c.klic2026.slice(0, KLIC_CUTOFF+1);
  var klLastLabel = KLIC_2026_KEYS[KLIC_CUTOFF];
  var klLastLive = false;
  if(klicBatchMap[klLastLabel] && klicBatchMap[klLastLabel][c.code] && klicBatchMap[klLastLabel][c.code].totalConfirmed !== null && klicBatchMap[klLastLabel][c.code].totalConfirmed !== undefined){
    klArr26[KLIC_CUTOFF] = klicBatchMap[klLastLabel][c.code].totalConfirmed;
    klLastLive = true;
  }

  var msTotal25 = sumArr(msArr25);
  var msTotal26 = sumArr(msArr26);
  var klTotal25 = sumArr(klArr25);
  var klTotal26 = sumArr(klArr26);

  // ---- Award eligibility (2026, fully-paid MS-CIT + KLiC admissions) ----
  var msFullyPaidForAward = anyInstall ? sumArr(msCitFullyPaid) : 0;
  var msDataIncomplete = false;
  for(var q=0;q<=MSCIT_CUTOFF;q++){ if((msArr26[q]||0) > 0 && msCitFullyPaid[q]===null) msDataIncomplete = true; }
  var awardBannerHtml = buildAwardBanner(msFullyPaidForAward, msTotal26, klTotal26, msDataIncomplete);

  // ---- Year-wise Admission Performance (2026 columns = sum of active batches only) ----
  var yearTable =
    '<div class="panel"><h2>Year-wise Admission Performance<span class="as-of">2026 figures as of ' + escapeHtml(msLastLabel) + ' (MS-CIT) / ' + escapeHtml(klLastLabel.replace('KLiC ','')) + ' (KLiC)</span></h2>' +
    '<table><thead><tr><th class="rowlabel"></th><th>2023</th><th>2024</th><th>2025</th><th>2026</th></tr></thead><tbody>' +
    '<tr class="row-mscit"><td class="rowlabel">MS-CIT</td><td class="num">' + fmt(c.msCit2023) + '</td><td class="num">' + fmt(c.msCit2024) + '</td><td class="num">' + fmt(c.msCit2025Total) + '</td><td class="num">' + fmt(msTotal26) + '</td></tr>' +
    '<tr class="row-klic"><td class="rowlabel">KLiC</td><td class="num">' + fmt(c.klic2023) + '</td><td class="num">' + fmt(c.klic2024) + '</td><td class="num">' + fmt(c.klic2025Total) + '</td><td class="num">' + fmt(klTotal26) + '</td></tr>' +
    '</tbody></table></div>';

  // ---- MS-CIT batch-wise table ----
  var msRows = '';
  for(var m=0;m<msLabels25.length;m++){
    var isLast = (m===MSCIT_CUTOFF);
    msRows += '<tr><td class="rowlabel">' + msLabels25[m] + '</td>' +
      '<td class="num">' + fmt(msArr25[m]) + '</td>' +
      '<td class="num' + (isLast && msLastLive ? ' live' : '') + '">' + fmt(msArr26[m]) + '</td>' +
      '<td class="num fp">' + fmt(msCitFullyPaid[m]) + '</td></tr>';
  }
  var msFPTotal = anyInstall ? sumArr(msCitFullyPaid) : null;
  var msFPDenom = 0;
  for(var j=0;j<msCitFullyPaid.length;j++){ if(msCitFullyPaid[j]!==null) msFPDenom += (msArr26[j]||0); }
  var msGrowth = (msTotal25 ? ((msTotal26-msTotal25)/msTotal25*100) : null);

  var msTable =
    '<div><div class="badge-title"><span class="chip mscit">MS-CIT</span><span style="font-size:12px;color:var(--ink-soft);">25 vs 26 &middot; through ' + escapeHtml(msLastLabel) + '</span></div>' +
    '<table><thead><tr><th class="rowlabel">Batch</th><th>2025</th><th>2026</th><th>Fully Paid</th></tr></thead><tbody>' +
    msRows +
    '<tr class="total-row"><td class="rowlabel">Total</td><td class="num">' + fmt(msTotal25) + '</td><td class="num">' + fmt(msTotal26) + '</td><td class="num fp">' + (anyInstall ? fmt(msFPTotal) : '&mdash;') + '</td></tr>' +
    '<tr class="pct-row"><td class="rowlabel">%tage</td><td></td>' +
      '<td>' + (msGrowth===null ? '&mdash;' : '<span class="delta ' + (msGrowth>=0?'up':'down') + '">' + (msGrowth>=0?'&#9650;':'&#9660;') + ' ' + Math.abs(msGrowth).toFixed(1) + '%</span>') + '</td>' +
      '<td>' + (anyInstall ? pctStr(msFPTotal, msFPDenom) : '&mdash;') + '</td>' +
    '</tr>' +
    '</tbody></table>' +
    (msLastLive ? '<p style="font-size:11px;color:var(--good);margin-top:6px;">"live" = ' + escapeHtml(msLastLabel) + ' count taken from Total Confirmed in the uploaded batch file.</p>' : '') +
    (anyInstall ? '' : '<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">No installment data uploaded yet for the batches of this center.</p>') +
    '</div>';

  // ---- KLiC batch-wise table ----
  var convArr = (EMBEDDED_DATA.conversions && EMBEDDED_DATA.conversions[c.code]) || null;
  var hasConversionData = !!(EMBEDDED_DATA.conversions && Object.keys(EMBEDDED_DATA.conversions).length);
  var klRows = '';
  var convTotal = 0;
  for(var k=0;k<klLabels.length;k++){
    var isLastK = (k===KLIC_CUTOFF);
    var convVal = convArr ? (convArr[k] || 0) : null;
    if(convVal) convTotal += convVal;
    klRows += '<tr><td class="rowlabel">' + klLabels[k] + '</td>' +
      '<td class="num">' + fmt(klArr25[k]) + '</td>' +
      '<td class="num' + (isLastK && klLastLive ? ' live' : '') + '">' + fmt(klArr26[k]) + '</td>' +
      '<td class="num conv-cell">' + (convArr ? fmt(convVal) : '') + '</td></tr>';
  }
  var klGrowth = (klTotal25 ? ((klTotal26-klTotal25)/klTotal25*100) : null);

  var klTable =
    '<div><div class="badge-title"><span class="chip klic">KLiC</span><span style="font-size:12px;color:var(--ink-soft);">25 vs 26 &middot; through ' + escapeHtml(klLastLabel.replace('KLiC ','')) + '</span></div>' +
    '<table><thead><tr><th class="rowlabel">Month</th><th>2025</th><th>2026</th><th title="Learners who did MS-CIT then re-registered for KLiC, that month">MS-CIT&rarr;KLiC</th></tr></thead><tbody>' +
    klRows +
    '<tr class="total-row"><td class="rowlabel">Total</td><td class="num">' + fmt(klTotal25) + '</td><td class="num">' + fmt(klTotal26) + '</td>' +
      '<td class="num conv-cell">' + (hasConversionData ? convTotal : '&mdash;') + '</td></tr>' +
    '<tr class="pct-row"><td class="rowlabel">%tage</td><td></td>' +
      '<td>' + (klGrowth===null ? '&mdash;' : '<span class="delta ' + (klGrowth>=0?'up':'down') + '">' + (klGrowth>=0?'&#9650;':'&#9660;') + ' ' + Math.abs(klGrowth).toFixed(1) + '%</span>') + '</td>' +
      '<td></td>' +
    '</tr>' +
    '</tbody></table>' +
    (klLastLive ? '<p style="font-size:11px;color:var(--good);margin-top:6px;">"live" = current month count taken from Total Confirmed in the uploaded batch file.</p>' : '') +
    (hasConversionData ? '' : '<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">No MS-CIT&rarr;KLiC conversion data uploaded yet.</p>') +
    '</div>';

  var batchPanel = '<div class="panel"><h2>Batch-wise Performance (2025 vs 2026)</h2><div class="two-col">' + msTable + klTable + '</div></div>';

  document.getElementById('results').innerHTML = awardBannerHtml + yearTable + batchPanel;
}
</script>
</body>
</html>
